stages:
  prepare:
    cmd: python src/data/prepare.py
    deps:
      - src/data/prepare.py
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python src/models/train.py
    deps:
      - src/models/train.py
      - data/processed/train.csv
      - data/processed/test.csv
      - params.yaml
    params:
      - model
    outs:
      - models/model.pkl